name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version (4.3.0 / 4.4.0 / 4.5.1 / 4.6.2)'
        required: true
        default: '4.4.0'
        type: choice
        options:
          - '4.3.0'
          - '4.4.0'
          - '4.5.1'
          - '4.6.2'
      publish_release:
        description: 'Publish as GitHub Release?'
        required: false
        default: false
        type: boolean

env:
  BUILD_TYPE: template_release

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x86_64
          - platform: linux
            runner: ubuntu-latest
            arch: x86_64
          - platform: macos
            runner: macos-latest
            arch: universal

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout godot-cpp tag
        shell: bash
        run: |
          cd godot-cpp
          git fetch origin --tags
          if git rev-parse "${{ inputs.godot_version }}" >/dev/null 2>&1; then
            git checkout "${{ inputs.godot_version }}"
            echo "Checked out godot-cpp tag: ${{ inputs.godot_version }}"
          else
            echo "ERROR: Tag '${{ inputs.godot_version }}' not found in godot-cpp"
            echo "Available tags:"
            git tag -l '4.*' | sort -V
            exit 1
          fi
          echo "godot-cpp commit: $(git rev-parse --short HEAD)"

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxi-dev libxinerama-dev libwayland-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scons
        run: pip install scons

      - name: Build
        shell: bash
        run: |
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ env.BUILD_TYPE }} embed_resources=yes -j$cores

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ inputs.godot_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: demo/addons/godot-minigame/bin/${{ matrix.platform }}/
          retention-days: 90

  release:
    name: Publish Release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: plugin-${{ inputs.godot_version }}-*

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          for dir in dist/plugin-${{ inputs.godot_version }}-*/; do
            platform=$(basename "$dir" | sed "s/plugin-${{ inputs.godot_version }}-//")
            # Create platform-specific zip
            cd "$dir"
            zip -r "$GITHUB_WORKSPACE/release/godot-minigame-plugin-${{ inputs.godot_version }}-${platform}.zip" .
            cd "$GITHUB_WORKSPACE"
          done

          # Create all-in-one bundle
          mkdir -p bundle/addons/godot-minigame/bin
          cp demo/addons/godot-minigame/plugin.cfg bundle/addons/godot-minigame/
          cp demo/addons/godot-minigame/plugin.gd bundle/addons/godot-minigame/
          cp demo/addons/godot-minigame/godot-minigame.gdextension bundle/addons/godot-minigame/
          for dir in dist/plugin-${{ inputs.godot_version }}-*/; do
            platform=$(basename "$dir" | sed "s/plugin-${{ inputs.godot_version }}-//")
            mkdir -p "bundle/addons/godot-minigame/bin/$platform"
            cp -r "$dir"* "bundle/addons/godot-minigame/bin/$platform/"
          done
          cd bundle && zip -r "$GITHUB_WORKSPACE/release/godot-minigame-plugin-${{ inputs.godot_version }}-all-platforms.zip" . && cd ..

          echo "Release contents:"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.godot_version }}
          name: Godot ${{ inputs.godot_version }} Plugin
          body: |
            Godot Minigame editor plugin for Godot ${{ inputs.godot_version }}

            ## Downloads
            - `all-platforms.zip` — Windows + Linux + macOS (推荐)
            - `windows-x86_64.zip` — 仅 Windows
            - `linux-x86_64.zip` — 仅 Linux
            - `macos-universal.zip` — 仅 macOS (Apple Silicon + Intel)

            ## 安装
            解压到你的 Godot 项目 `res://addons/godot-minigame/` 目录下
          files: release/*
