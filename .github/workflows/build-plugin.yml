name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version'
        required: true
        default: 'godot-4.4-stable'
        type: choice
        options:
          - 'godot-4.3-stable'
          - 'godot-4.4-stable'
          - 'godot-4.4.1-stable'
          - 'godot-4.5-stable'
      publish_release:
        description: 'Publish as GitHub Release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  BUILD_TYPE: template_release

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x86_64
          - platform: linux
            runner: ubuntu-latest
            arch: x86_64
          - platform: macos
            runner: macos-latest
            arch: universal
    steps:
      - uses: actions/checkout@v4
      - name: Clone godot-cpp at version
        shell: bash
        run: |
          rm -rf godot-cpp
          git clone --depth 1 --branch ${{ inputs.godot_version }} https://github.com/godotengine/godot-cpp.git godot-cpp
          echo "godot-cpp at: $(cd godot-cpp && git rev-parse --short HEAD)"
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxi-dev libxinerama-dev libwayland-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scons
        run: pip install scons
      - name: Build
        shell: bash
        run: |
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ env.BUILD_TYPE }} embed_resources=yes -j$cores
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ inputs.godot_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: demo/addons/godot-minigame/bin/${{ matrix.platform }}/
          retention-days: 90

  release:
    name: Publish Release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: plugin-${{ inputs.godot_version }}-*
      - name: Package as ready-to-use addon
        shell: bash
        run: |
          mkdir -p release

          # Build the complete addons/godot-minigame/ directory structure
          ADDON_DIR="addons/godot-minigame"
          mkdir -p "$ADDON_DIR/bin"

          # Copy plugin metadata files from repo
          cp demo/addons/godot-minigame/plugin.cfg "$ADDON_DIR/"
          cp demo/addons/godot-minigame/plugin.gd "$ADDON_DIR/"
          cp demo/addons/godot-minigame/godot-minigame.gdextension "$ADDON_DIR/"

          # Copy .uid files if they exist
          for uid in demo/addons/godot-minigame/*.uid; do
            [ -f "$uid" ] && cp "$uid" "$ADDON_DIR/"
          done

          # Copy compiled libraries from all platforms
          for dir in dist/plugin-${{ inputs.godot_version }}-*/; do
            platform=$(basename "$dir" | sed "s/plugin-${{ inputs.godot_version }}-//")
            # Extract platform name (e.g. "windows-x86_64" -> "windows")
            plat_name=$(echo "$platform" | cut -d- -f1)
            mkdir -p "$ADDON_DIR/bin/$plat_name"
            cp -r "$dir"* "$ADDON_DIR/bin/$plat_name/"
          done

          echo "=== Addon structure ==="
          find "$ADDON_DIR" -type f | sort

          # Create the all-platforms zip (addons/ root so user can unzip directly into project)
          zip -r "release/godot-minigame-plugin-${{ inputs.godot_version }}-all-platforms.zip" "$ADDON_DIR"

          # Also create per-platform zips for smaller downloads
          for dir in dist/plugin-${{ inputs.godot_version }}-*/; do
            platform=$(basename "$dir" | sed "s/plugin-${{ inputs.godot_version }}-//")
            plat_name=$(echo "$platform" | cut -d- -f1)
            # Per-platform: metadata + only that platform's bin
            plat_dir="addons/godot-minigame"
            mkdir -p "plat_$plat_name/$plat_dir/bin/$plat_name"
            cp demo/addons/godot-minigame/plugin.cfg "plat_$plat_name/$plat_dir/"
            cp demo/addons/godot-minigame/plugin.gd "plat_$plat_name/$plat_dir/"
            cp demo/addons/godot-minigame/godot-minigame.gdextension "plat_$plat_name/$plat_dir/"
            for uid in demo/addons/godot-minigame/*.uid; do
              [ -f "$uid" ] && cp "$uid" "plat_$plat_name/$plat_dir/"
            done
            cp -r "$dir"* "plat_$plat_name/$plat_dir/bin/$plat_name/"
            zip -r "release/godot-minigame-plugin-${{ inputs.godot_version }}-${platform}.zip" "plat_$plat_name/$ADDON_DIR"
            rm -rf "plat_$plat_name"
          done

          echo "=== Release contents ==="
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.godot_version }}
          name: Plugin for Godot ${{ inputs.godot_version }}
          body: |
            Godot Minigame editor plugin — built against godot-cpp `${{ inputs.godot_version }}`

            ## Downloads
            - `all-platforms.zip` — Windows + Linux + macOS (完整插件目录)
            - `windows-x86_64.zip` / `linux-x86_64.zip` / `macos-universal.zip` — 单平台

            ## Install
            1. 下载 `all-platforms.zip`（或对应平台包）
            2. 解压到 Godot 项目的 `res://` 目录（会自动创建 `addons/godot-minigame/`）
            3. 编辑器 → 项目 → 项目设置 → 插件 → 启用 `Godot Minigame`
          files: release/*
