name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version'
        required: true
        default: 'godot-4.4-stable'
        type: choice
        options:
          - 'godot-4.3-stable'
          - 'godot-4.4-stable'
          - 'godot-4.4.1-stable'
          - 'godot-4.5-stable'
      publish_release:
        description: 'Publish as GitHub Release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  BUILD_TYPE: template_release

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x86_64
          - platform: linux
            runner: ubuntu-latest
            arch: x86_64
          - platform: macos
            runner: macos-latest
            arch: universal
    steps:
      - uses: actions/checkout@v4
      - name: Clone godot-cpp at version
        shell: bash
        run: |
          rm -rf godot-cpp
          git clone --depth 1 --branch ${{ inputs.godot_version }} https://github.com/godotengine/godot-cpp.git godot-cpp
          echo "godot-cpp at: $(cd godot-cpp && git rev-parse --short HEAD)"
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxi-dev libxinerama-dev libwayland-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scons
        run: pip install scons
      - name: Build
        shell: bash
        run: |
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ env.BUILD_TYPE }} embed_resources=yes -j$cores
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ inputs.godot_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: demo/addons/godot-minigame/bin/${{ matrix.platform }}/
          retention-days: 90

  release:
    name: Publish Release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: plugin-${{ inputs.godot_version }}-*
      - name: Download template from upstream
        shell: bash
        run: |
          # Map godot-cpp tag to upstream template version
          case "${{ inputs.godot_version }}" in
            godot-4.3-stable)   TPZ_VER="4.3.0"; TPZ_FILE="minigame4.3.0.3.tpz" ;;
            godot-4.4-stable)   TPZ_VER="4.4.0"; TPZ_FILE="minigame4.4.0.1.tpz" ;;
            godot-4.4.1-stable) TPZ_VER="4.4.0"; TPZ_FILE="minigame4.4.0.1.tpz" ;;
            godot-4.5-stable)   TPZ_VER="4.5.1"; TPZ_FILE="minigame4.5.1.tpz" ;;
            *) echo "Unknown version"; exit 1 ;;
          esac
          echo "TPZ_VER=$TPZ_VER" >> $GITHUB_ENV
          echo "TPZ_FILE=$TPZ_FILE" >> $GITHUB_ENV
          curl -L -o "release-tpz/$TPZ_FILE" "https://github.com/godothub/godot-minigame/releases/download/${TPZ_VER}/${TPZ_FILE}" 2>&1 || true
          mkdir -p release-tpz
          curl -L -o "release-tpz/$TPZ_FILE" "https://github.com/godothub/godot-minigame/releases/download/${TPZ_VER}/${TPZ_FILE}"
          ls -lh release-tpz/
      - name: Package as ready-to-use addon
        shell: bash
        run: |
          mkdir -p release

          # Build the complete addons/godot-minigame/ directory structure
          ADDON_DIR="addons/godot-minigame"
          mkdir -p "$ADDON_DIR/bin"

          # Copy plugin metadata files from repo
          cp demo/addons/godot-minigame/plugin.cfg "$ADDON_DIR/"
          cp demo/addons/godot-minigame/plugin.gd "$ADDON_DIR/"
          cp demo/addons/godot-minigame/godot-minigame.gdextension "$ADDON_DIR/"

          # Copy .uid files if they exist
          for uid in demo/addons/godot-minigame/*.uid; do
            [ -f "$uid" ] && cp "$uid" "$ADDON_DIR/"
          done

          # Copy compiled libraries from all platforms
          for dir in dist/plugin-${{ inputs.godot_version }}-*/; do
            platform=$(basename "$dir" | sed "s/plugin-${{ inputs.godot_version }}-//")
            plat_name=$(echo "$platform" | cut -d- -f1)
            mkdir -p "$ADDON_DIR/bin/$plat_name"
            cp -r "$dir"* "$ADDON_DIR/bin/$plat_name/"
          done

          # Copy template .tpz into addon dir for local use
          mkdir -p "$ADDON_DIR/templates"
          cp release-tpz/$TPZ_FILE "$ADDON_DIR/templates/"

          echo "=== Addon structure ==="
          find "$ADDON_DIR" -type f | sort

          # All-platforms zip (with template)
          zip -r "release/godot-minigame-plugin-${{ inputs.godot_version }}-all-platforms.zip" "$ADDON_DIR"

          # Template-only zip
          cp release-tpz/$TPZ_FILE "release/$TPZ_FILE"

          echo "=== Release contents ==="
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.godot_version }}
          name: Plugin for Godot ${{ inputs.godot_version }}
          body: |
            Godot Minigame editor plugin + 微信小游戏模板 — built against godot-cpp `${{ inputs.godot_version }}`

            ## Downloads
            - `all-platforms.zip` — 完整插件目录（含模板 .tpz）
            - `$TPZ_FILE` — 微信小游戏模板（单独下载）

            ## Install
            1. 下载 `all-platforms.zip`
            2. 解压到 Godot 项目的 `res://` 目录（会自动创建 `addons/godot-minigame/`）
            3. 编辑器 → 项目 → 项目设置 → 插件 → 启用 `Godot Minigame`
            4. 在 Minigame 面板配置模板源指向本仓库 Release

            ## 模板已内置
            模板文件在 `addons/godot-minigame/templates/` 目录下，插件可从本地加载，无需联网下载。
          files: release/*
