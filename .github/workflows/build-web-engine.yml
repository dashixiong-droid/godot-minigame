name: Build Godot Web Engine (WeChat compatible)

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot source tag/branch'
        required: true
        default: '4.4-stable'
        type: choice
        options:
          - '4.3-stable'
          - '4.4-stable'
          - '4.4.1-stable'
          - '4.5-stable'
      emsdk_version:
        description: 'Emscripten SDK version'
        required: true
        default: '3.1.63'
        type: string

permissions:
  contents: write

jobs:
  build-web:
    name: Build Godot Web (no Wasm EH)
    runs-on: ubuntu-latest
    steps:
      - name: Clone Godot source
        run: |
          git clone --depth 1 --branch ${{ inputs.godot_version }} https://github.com/godotengine/godot.git godot-src
          echo "Godot at: $(cd godot-src && git rev-parse --short HEAD)"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.emsdk_version }}
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: emcc --version

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxi-dev libxinerama-dev libwayland-dev build-essential

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Godot Web (template_release, no exceptions)
        working-directory: godot-src
        run: |
          # Build with exceptions disabled for WeChat compatibility
          # - dlink_enabled=yes: GDExtension support (needed for plugins)
          # - exceptions=disabled: No Wasm EH opcodes (WeChat runtime doesn't support them)
          # - threads_enabled=no: Avoid SharedArrayBuffer issues on some platforms
          scons platform=web target=template_release \
            dlink_enabled=yes \
            exceptions=disabled \
            -j$(nproc)

      - name: Build Godot Web (template_debug, no exceptions)
        working-directory: godot-src
        run: |
          scons platform=web target=template_debug \
            dlink_enabled=yes \
            exceptions=disabled \
            -j$(nproc)

      - name: Collect output
        run: |
          mkdir -p release
          # Template release
          cp godot-src/bin/godot.web.template_release.wasm32.* release/ 2>/dev/null || true
          # Template debug
          cp godot-src/bin/godot.web.template_debug.wasm32.* release/ 2>/dev/null || true
          echo "=== Output files ==="
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-noeh-${{ inputs.godot_version }}
          path: release/
          retention-days: 90

  package-tpz:
    name: Package .tpz with custom engine
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download engine artifacts
        uses: actions/download-artifact@v4
        with:
          name: godot-web-noeh-${{ inputs.godot_version }}
          path: engine-out/

      - name: Download upstream .tpz template
        shell: bash
        run: |
          # Map Godot version to upstream template
          case "${{ inputs.godot_version }}" in
            4.3-stable)   TPZ_VER="4.3.0"; TPZ_FILE="minigame4.3.0.3.tpz" ;;
            4.4-stable)   TPZ_VER="4.4.0"; TPZ_FILE="minigame4.4.0.1.tpz" ;;
            4.4.1-stable) TPZ_VER="4.4.0"; TPZ_FILE="minigame4.4.0.1.tpz" ;;
            4.5-stable)   TPZ_VER="4.5.1"; TPZ_FILE="minigame4.5.1.tpz" ;;
            *) echo "Unknown version"; exit 1 ;;
          esac
          echo "TPZ_VER=$TPZ_VER" >> $GITHUB_ENV
          echo "TPZ_FILE=$TPZ_FILE" >> $GITHUB_ENV

          curl -L -o "upstream.tpz" "https://github.com/godothub/godot-minigame/releases/download/${TPZ_VER}/${TPZ_FILE}"

      - name: Replace engine in .tpz
        shell: bash
        run: |
          # Extract upstream template
          mkdir -p tpz-original
          cd tpz-original
          unzip ../upstream.tpz

          echo "=== Original engine files ==="
          ls -lh engine/

          # Replace godot.wasm.br and godot.js with our custom build
          # First, check what we built
          echo "=== Custom engine files ==="
          ls -lh ../engine-out/

          # The Godot build outputs are like godot.web.template_release.wasm32.js and .wasm
          # We need to rename them to match the template structure
          cp ../engine-out/godot.web.template_release.wasm32.js engine/godot.js
          cp ../engine-out/godot.web.template_release.wasm32.wasm engine/godot.wasm

          # Compress wasm with brotli (like upstream does)
          if command -v brotli &> /dev/null; then
            brotli engine/godot.wasm
            echo "Compressed godot.wasm -> godot.wasm.br"
          else
            sudo apt-get install -y brotli
            brotli engine/godot.wasm
            echo "Compressed godot.wasm -> godot.wasm.br"
          fi

          echo "=== New engine files ==="
          ls -lh engine/

          # Repackage as .tpz (zip)
          cd ..
          cd tpz-original && zip -r ../release/minigame-custom-noeh-${TPZ_VER}.tpz . && cd ..

          echo "=== Final .tpz ==="
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wechat-noeh-${{ inputs.godot_version }}
          name: WeChat-compatible engine (no Wasm EH) - Godot ${{ inputs.godot_version }}
          body: |
            Godot Web 引擎定制构建 — 禁用 Wasm Exception Handling，兼容微信小游戏运行时

            ## 修改内容
            - `exceptions=disabled`：禁用 Wasm EH 指令（解决 `Invalid opcode 0x6` 报错）
            - `dlink_enabled=yes`：保留 GDExtension 支持

            ## 包含
            - `minigame-custom-noeh-*.tpz`：替换了引擎的微信小游戏模板
            - 用法：下载 .tpz，替换上游模板中 `engine/godot.wasm.br` 和 `engine/godot.js`

            ## 安装
            1. 下载 `.tpz`
            2. 解压到导出目录，或放到 `addons/godot-minigame/templates/` 供插件使用
          files: release/*
