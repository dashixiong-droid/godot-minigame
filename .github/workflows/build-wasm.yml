name: Build Godot WASM for WeChat Mini Game

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version (for naming, e.g. 4.6.2)'
        required: true
        type: string
        default: '4.6.2'
      godot_commit:
        description: 'Godot commit hash'
        required: false
        type: string
        default: 'a16e481cf424f8e39dc2cdea1a6bdc1e309acdc1'
      dlink_enabled:
        description: 'Enable dynamic linking (side wasm)'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      threads:
        description: 'Enable threading support'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'no'
      wasm_simd:
        description: 'Enable WASM SIMD'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'no'
      include_audio_worker:
        description: 'Include audio worker optional feature'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      brotli_quality:
        description: 'Brotli compression quality (1-11)'
        required: false
        type: string
        default: '11'
      minify_js:
        description: 'Minify godot.js with Terser'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'yes'
      create_release:
        description: 'Create GitHub Release with tpz'
        required: false
        type: choice
        options: ['yes', 'no']
        default: 'yes'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI repo (godot-minigame fork)
        uses: actions/checkout@v4

      - name: Clone Godot engine
        run: |
          mkdir -p godot-engine
          cd godot-engine
          git init
          GODOT_COMMIT="a16e481cf424f8e39dc2cdea1a6bdc1e309acdc1"
          if [ -n "${{ inputs.godot_commit }}" ]; then
            GODOT_COMMIT="${{ inputs.godot_commit }}"
          fi
          git fetch --depth 1 https://github.com/godotengine/godot.git "$GODOT_COMMIT"
          git checkout FETCH_HEAD
          echo "Godot engine at commit: $(git rev-parse HEAD)"

      - name: Apply minigame patches
        run: |
          OPTIONAL_FLAGS=""
          if [ "${{ inputs.include_audio_worker }}" = "yes" ]; then
            OPTIONAL_FLAGS="--include-optional audio-worker"
          fi
          python3 skills/scripts/apply_godot_patchset.py godot-engine \
            --allow-base-mismatch \
            --allow-dirty \
            $OPTIONAL_FLAGS

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.1
          actions-cache-folder: 'emsdk-cache'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq scons brotli

      - name: Verify emsdk
        run: |
          emcc --version
          which emcc
          scons --version

      - name: SCons build Godot WASM
        run: |
          cd godot-engine
          SCONS_FLAGS="platform=web target=template_release"
          if [ "${{ inputs.dlink_enabled }}" = "yes" ]; then
            SCONS_FLAGS="$SCONS_FLAGS dlink_enabled=yes"
          fi
          if [ "${{ inputs.threads }}" = "yes" ]; then
            SCONS_FLAGS="$SCONS_FLAGS threads=yes"
          fi
          if [ "${{ inputs.wasm_simd }}" = "yes" ]; then
            SCONS_FLAGS="$SCONS_FLAGS wasm_simd=yes"
          fi
          echo "SCons flags: $SCONS_FLAGS"
          scons $SCONS_FLAGS -j$(nproc)

      - name: Copy build artifacts to .web_zip
        run: |
          cd godot-engine
          mkdir -p bin/.web_zip
          cp -v bin/godot.web.template_release.wasm32.nothreads.wasm bin/.web_zip/godot.wasm 2>/dev/null || true
          for f in bin/godot.web.template_release.wasm32.nothreads.*.wasm; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              suffix=$(echo "$base" | sed 's/godot\.web\.template_release\.wasm32\.nothreads\.//')
              cp -v "$f" "bin/.web_zip/godot.${suffix}"
            fi
          done
          cp -v bin/godot.web.template_release.wasm32.nothreads.js bin/.web_zip/godot.js 2>/dev/null || true
          ls -la bin/.web_zip/

      - name: Run godot_process.js post-processing
        run: |
          cd godot-engine
          node ../skills/scripts/godot_process.js

      - name: Minify godot.js (Terser)
        if: ${{ inputs.minify_js == 'yes' }}
        run: |
          cd godot-engine/bin/.web_zip
          echo "Before minify: $(wc -c < godot.js) bytes"
          npx terser godot.js \
            --compress passes=2,drop_console=true,pure_getters=true,keep_fargs=false,unsafe_comps=true,unsafe=true \
            --mangle toplevel=true \
            --output godot.js
          echo "After minify:  $(wc -c < godot.js) bytes"

      - name: Brotli compress wasm files
        run: |
          cd godot-engine/bin/.web_zip
          for wasm in *.wasm; do
            echo "Compressing $wasm with brotli quality ${{ inputs.brotli_quality }}..."
            brotli -q ${{ inputs.brotli_quality }} -f "$wasm" -o "${wasm}.br"
          done
          ls -la

      - name: Package tpz
        run: |
          chmod +x scripts/pack_tpz.sh
          bash scripts/pack_tpz.sh "${{ inputs.godot_version }}" godot-engine/bin/.web_zip
          echo "TPZ size: $(ls -lh output/*.tpz | awk '{print $5}')"

      - name: Upload raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-wasm-${{ inputs.godot_version }}-${{ github.run_id }}
          path: godot-engine/bin/.web_zip
          include-hidden-files: true

      - name: Upload tpz artifact
        uses: actions/upload-artifact@v4
        with:
          name: minigame${{ inputs.godot_version }}-tpz
          path: output/*.tpz

      - name: Create GitHub Release
        if: ${{ inputs.create_release == 'yes' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.godot_version }}
          name: Godot ${{ inputs.godot_version }} WASM Template
          body: |
            ## Godot ${{ inputs.godot_version }} WeChat Mini Game Template

            **Build Info:**
            - Godot commit: `${{ inputs.godot_commit }}`
            - DLink: ${{ inputs.dlink_enabled }}
            - Threads: ${{ inputs.threads }}
            - SIMD: ${{ inputs.wasm_simd }}
            - Audio Worker: ${{ inputs.include_audio_worker }}
            - JS Minified: ${{ inputs.minify_js }}

            **Files:**
            - `minigame${{ inputs.godot_version }}.tpz` — Full template package
            - Raw artifacts available in build artifacts

            [Download from build artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: output/*.tpz
          draft: false
          prerelease: false
