name: Build Godot Minigame Plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version to build against (e.g. 4.6.2)'
        required: false
        default: '4.6.2'

env:
  BUILD_TYPE: template_release

jobs:
  # ──────────────────────────────────────────
  # Job 1: Build GDExtension editor plugin
  # ──────────────────────────────────────────
  build-plugin:
    name: Plugin (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x86_64
          - platform: linux
            runner: ubuntu-latest
            arch: x86_64
          - platform: linux
            runner: ubuntu-latest
            arch: arm64
          - platform: macos
            runner: macos-latest
            arch: universal

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxi-dev libxinerama-dev libwayland-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scons
        run: pip install scons

      - name: Build plugin
        run: |
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ env.BUILD_TYPE }} embed_resources=yes -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}-${{ matrix.arch }}
          path: demo/addons/godot-minigame/bin/${{ matrix.platform }}/
          retention-days: 30

  # ──────────────────────────────────────────
  # Job 2: Build WeChat minigame engine template
  # This patches Godot source and builds Web export template
  # ──────────────────────────────────────────
  build-engine-template:
    name: Engine Template (Web/WeChat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config libx11-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxi-dev libxinerama-dev libwayland-dev
          pip install scons

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Clone Godot source
        run: |
          git clone --depth 1 --branch 4.6 https://github.com/godotengine/godot.git godot-source
          cd godot-source
          echo "Godot commit: $(git rev-parse HEAD)"

      - name: Apply minigame patches
        run: |
          python skills/scripts/apply_godot_patchset.py godot-source --allow-base-mismatch

      - name: Build Web template (no threads, no SIMD)
        working-directory: godot-source
        run: |
          scons platform=web target=template_release threads=no wasm_simd=no -j$(nproc)

      - name: Post-process engine
        working-directory: godot-source
        run: |
          node $GITHUB_WORKSPACE/skills/scripts/godot_process.js

      - name: Compress WASM
        working-directory: godot-source
        run: |
          sh $GITHUB_WORKSPACE/skills/scripts/compress_wasm.sh

      - name: Vendor runtime shell
        run: |
          python skills/scripts/install_min_runtime.py engine-output

      - name: Collect engine files
        run: |
          mkdir -p engine-output
          cp godot-source/bin/.web_zip/godot.js engine-output/ 2>/dev/null || true
          cp godot-source/bin/.web_zip/godot.wasm engine-output/ 2>/dev/null || true
          cp godot-source/bin/.web_zip/godot.wasm.br engine-output/ 2>/dev/null || true
          cp skills/assets/min-runtime/godot-sdk.js engine-output/ 2>/dev/null || true
          cp skills/assets/min-runtime/godot-loader.js engine-output/ 2>/dev/null || true
          cp demo/weapp-adapter.js engine-output/ 2>/dev/null || true
          cp demo/godot-loader.js engine-output/ 2>/dev/null || true
          ls -la engine-output/

      - name: Upload engine template
        uses: actions/upload-artifact@v4
        with:
          name: engine-template-wechat
          path: engine-output/
          retention-days: 30

  # ──────────────────────────────────────────
  # Job 3: Package all artifacts into release
  # ──────────────────────────────────────────
  package:
    name: Package Release
    needs: [build-plugin, build-engine-template]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Create plugin bundle
        run: |
          mkdir -p release/godot-minigame-plugin
          # Copy plugin metadata
          cp demo/addons/godot-minigame/godot-minigame.gdextension release/godot-minigame-plugin/
          cp demo/addons/godot-minigame/plugin.cfg release/godot-minigame-plugin/
          cp demo/addons/godot-minigame/plugin.gd release/godot-minigame-plugin/
          # Copy binaries from all platforms
          for dir in dist/plugin-*/; do
            platform=$(basename "$dir" | sed 's/plugin-//')
            mkdir -p "release/godot-minigame-plugin/bin/$platform"
            cp -r "$dir"* "release/godot-minigame-plugin/bin/$platform/"
          done

      - name: Create engine bundle
        run: |
          mkdir -p release/wechat-engine-template
          cp -r dist/engine-template-wechat/* release/wechat-engine-template/
          # Copy adapter and config files
          cp demo/weapp-adapter.js release/wechat-engine-template/
          cp demo/wxgame/game.js release/wechat-engine-template/
          cp demo/wxgame/game.json release/wechat-engine-template/

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: godot-minigame-release
          path: release/
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          draft: true
          files: |
            release/**/*
